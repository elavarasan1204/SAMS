# ============================================
# SAMS - Application Properties
# ============================================

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/student_attendance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=sams-secret-key-for-jwt-authentication-2024-this-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.sams=INFO
logging.level.org.springframework.security=WARN
